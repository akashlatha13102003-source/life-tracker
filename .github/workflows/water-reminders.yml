name: Water reminders

on:
  schedule:
    - cron: '7,22,37,52 * * * *'   # every 15 min, off the busy :00 mark (GitHub may still run late)
  workflow_dispatch:
    inputs:
      test:
        description: Send a test notification now
        type: boolean
        default: true

permissions:
  contents: write   # only used by the keep-alive step below

concurrency:
  group: water-reminders
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install
        working-directory: .github/scripts
        run: npm install --omit=dev --no-audit --no-fund --loglevel=error

      - name: Send reminders
        working-directory: .github/scripts
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          TEST_PUSH: ${{ github.event_name == 'workflow_dispatch' && inputs.test }}
        run: node send-reminders.mjs

      # GitHub pauses scheduled jobs in repos with no commits for 60 days.
      # This makes a tiny commit every ~45 days so reminders never stop.
      - name: Keep schedule active
        if: github.event_name == 'schedule'
        run: |
          last=$(git log -1 --format=%ct)
          if [ $(( $(date +%s) - last )) -gt $(( 45 * 86400 )) ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            date -u > .github/keepalive
            git add .github/keepalive
            git commit -m "Keep water reminder schedule active"
            git push
          fi
